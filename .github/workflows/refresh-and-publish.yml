name: Refresh sources and publish assistant

on:
  push:
    branches: [main]
  schedule:
    # 06:17 Eastern during daylight saving time; 05:17 during standard time.
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Refresh public toolkit, website and trackers before publishing
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: senate-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Test application before refreshing
        run: npm test
      - name: Set up Python for public-source extraction
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_sources)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-refresh.txt
      - name: Install document and image extraction dependencies
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_sources)
        run: |
          python -m pip install -r requirements-refresh.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Restore public download and content-hash OCR cache
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_sources)
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/senate-source-cache
          key: senate-source-cache-${{ github.run_id }}
          restore-keys: senate-source-cache-
      - name: Refresh all readable public sources in staging
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_sources)
        env:
          SOURCE_CACHE: ${{ runner.temp }}/senate-source-cache
        run: python scripts/refresh_sources.py
      - name: Validate refreshed application and source generation
        run: npm test
      - name: Save validated source generation
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_sources)
        run: |
          git add data
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public Senate sources'
            # A concurrent human update safely rejects this push. The next run retries.
            git push origin HEAD:main
          fi
      - name: Prepare public site artifact
        run: node scripts/build_pages.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated site and sources
        id: deployment
        uses: actions/deploy-pages@v4
